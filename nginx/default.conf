# Rate limit zone: 10 requests/second per IP, 10MB shared memory
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Upstream: the Flask backend server(s)
upstream flask_backend {
    server flask-app:5000;
    # Add more for load balancing:
    # server flask-app-2:5000 weight=2;
    # server flask-app-3:5000;
}

server {
    listen 80;
    server_name localhost;

    # ------------------------------------------
    # Serve static files directly (fast, no Flask overhead)
    # ------------------------------------------
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Serve the frontend at /
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # ------------------------------------------
    # Reverse proxy: /api/* and /health → Flask
    # Key pattern: Nginx accepts client requests,
    # forwards them to the backend, and returns
    # the response. The client never talks to Flask directly.
    # ------------------------------------------
    location /api/ {
        # Rate limiting (returns 429 if exceeded)
        limit_req zone=api_limit burst=20 nodelay;

        # Forward the request to the upstream
        proxy_pass http://flask_backend;

        # Standard proxy headers — needed so Flask sees the real client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Response buffering
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
    }

    # Health check endpoint (no rate limit)
    location /health {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
