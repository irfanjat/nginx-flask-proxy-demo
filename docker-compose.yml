services:

  # -------------------------------
  # Flask backend (your application)
  # -------------------------------
  flask-app:
    build: ./backend
    container_name: flask-app
    expose:
      - "5000"  # Internal to the Docker network (not exposed to host)
    networks:
      - app-net

  # -------------------------------
  # Nginx reverse proxy (entry point)
  # -------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8888:80"  # Maps host:8080 → container:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro  # Config
      - ./frontend:/usr/share/nginx/html:ro                      # Static files
    depends_on:
      - flask-app
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
